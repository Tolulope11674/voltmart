
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoltMart | AI Customer Care</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .chat-header {
            background: #0756a5;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .chat-header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .chat-header p {
            margin: 0;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: white;
            text-decoration: none;
        }

        #messages {
            height: 380px;
            overflow-y: auto;
            padding: 18px;
            background: #ffffff;
        }

        .message {
            max-width: 88%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border-radius: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .bot {
            background: #edf2f7;
            color: #1f2937;
            margin-right: auto;
        }

        .user {
            background: #0756a5;
            color: white;
            margin-left: auto;
        }

        .error {
            background: #fff0f0;
            color: #a32121;
            border: 1px solid #f0caca;
            margin-right: auto;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #e5e7eb;
        }

        #messageInput {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline-color: #0756a5;
        }

        #sendButton {
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            background: #0756a5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hint {
            padding: 0 15px 15px;
            margin: 0;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            #messages {
                height: 55vh;
            }

            .chat-header h1 {
                font-size: 20px;
            }

            #sendButton {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="chat-container">

        <header class="chat-header">
            <h1>⚡ VoltMart AI Care</h1>
            <p>Your electrical shopping assistant</p>
            <a class="back-link" href="/">← Back to VoltMart</a>
        </header>

        <section id="messages" aria-live="polite">
            <div class="message bot">
                Hello! Welcome to VoltMart.

                I can help you with electrical products,
                shopping questions and general product information.

                What would you like to know?
            </div>
        </section>

        <form id="chatForm" class="chat-form">
            <input
                type="text"
                id="messageInput"
                placeholder="Ask me a question..."
                maxlength="1000"
                autocomplete="off"
                aria-label="Your message"
                required
            >

            <button type="submit" id="sendButton">
                Send
            </button>
        </form>

        <p class="hint">
            For electrical installation or repair, consult a qualified electrician.
        </p>

    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");

            message.className = "message " + type;
            message.textContent = text;

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;

            return message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const question = input.value.trim();

            if (!question || sendButton.disabled) {
                return;
            }

            addMessage(question, "user");

            input.value = "";
            sendButton.disabled = true;
            input.disabled = true;

            const loading = addMessage("Thinking...", "bot");

            try {
                const response = await fetch("/ai-chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        data.reply ||
                        "The AI service returned an error (" +
                        response.status + ")."
                    );
                }

                if (!data.reply) {
                    throw new Error(
                        "The server returned an empty answer."
                    );
                }

                loading.textContent = data.reply;

            } catch (error) {
                loading.className = "message error";

                if (error instanceof TypeError) {
                    loading.textContent =
                        "Cannot connect to VoltMart's server. " +
                        "Check that Flask is running and try again.";
                } else {
                    loading.textContent = error.message;
                }

                console.error("VoltMart chatbot error:", error);

            } finally {
                sendButton.disabled = false;
                input.disabled = false;
                input.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        });
    </script>

</body>
</html>
