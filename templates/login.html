<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | VoltMart</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
                           filename='css/style.css') }}">

</head>

<body class="auth-body">

<div class="auth-card">

    <div class="auth-logo">
        ⚡ VoltMart
    </div>

    <h1>
        Welcome Back
    </h1>

    <p>
        Login to continue shopping.
    </p>


    <form method="POST">

        <label>
            Email
        </label>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>


        <label>
            Password
        </label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>


        <button type="submit"
                class="primary-button full">
            Login
        </button>

    </form>


    <p class="auth-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>

</div>

</body>
</html>
